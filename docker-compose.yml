name: xylosync

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  APP_SECRET: ${APP_SECRET:-change-me-to-a-long-random-string}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  MAX_ROOMS_PER_USER: ${MAX_ROOMS_PER_USER:-3}
  ROOM_TTL_HOURS: ${ROOM_TTL_HOURS:-8}
  MAX_FILE_MB: ${MAX_FILE_MB:-15}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-xylosync}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-xylosync-secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-xylosync}
  MINIO_WEBHOOK_TARGET: XYLOSYNC
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
  LOG_WEBHOOKS: ${LOG_WEBHOOKS:-false}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-XyloSync <no-reply@xylosync.local>}
  MAIL_INBOX_URL: ${MAIL_INBOX_URL:-http://localhost:8025}

services:
  app:
    build: .
    image: xylosync:local
    command: ["node", "server/server.js"]
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      default:
        # Browsers force HTTPS for a host called "app" (.app is an HSTS-preloaded TLD),
        # so the e2e browser reaches the app as "web".
        aliases: [web]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    # Same image as the app; building here too means a clean "docker compose up" never tries to pull it.
    build: .
    image: xylosync:local
    command: ["node", "server/worker.js"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard ships patched, signed builds.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xylosync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xylosync-secret}
      # Bucket events are POSTed to the app, which pushes them to browsers over Socket.IO.
      MINIO_NOTIFY_WEBHOOK_ENABLE_XYLOSYNC: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_XYLOSYNC: http://app:3000/webhooks/storage
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_XYLOSYNC: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      # No queue_dir on purpose: MinIO's persistent queue flushes in ~3s batches, while direct
      # delivery is near-instant. Clients re-sync the file list whenever they reconnect.
    ports:
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # End-to-end tests in real Chromium: docker compose --profile test run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /e2e
    environment:
      BASE_URL: http://web:3000
      MAILPIT_URL: http://mailpit:8025
      CI: "1"
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  e2e-node-modules:
  redis-data:
  minio-data:
